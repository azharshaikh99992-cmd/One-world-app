<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050b14" />
  <title>ONE WORLD</title><link rel="manifest" href="manifest.json" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #050b14; color: #e9edef; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    a[href*="netlify.com"], div[class*="netlify"], iframe[src*="netlify"] { display: none !important; }

    #toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: #ef4444; color: #fff; padding: 10px 18px; border-radius: 20px;
      font-size: 13px; z-index: 99999; display: none; max-width: 90%; text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* 3D GLOBE SPLASH */
    #splash-screen {
      position: fixed; inset: 0; background: radial-gradient(circle at center, #0d1f3c 0%, #030712 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000;
    }
    .splash-title {
      font-size: 28px; font-weight: 800; letter-spacing: 4px; margin-top: 12px;
      background: linear-gradient(90deg, #60a5fa, #38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .splash-sub { color: #94a3b8; font-size: 12px; margin-top: 6px; letter-spacing: 2px; }
    .btn-enter {
      margin-top: 26px; padding: 12px 30px; border-radius: 25px; border: 1px solid #3b82f6;
      background: #2563eb; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer;
    }

    /* AUTH SCREEN */
    #auth-screen {
      display: none; flex-direction: column; justify-content: center; align-items: center;
      height: 100dvh; padding: 20px; background: #0b141a;
    }
    .auth-box {
      width: 100%; max-width: 370px; background: #1f2c34; padding: 24px 20px;
      border-radius: 16px; border: 1px solid #2a3942;
    }
    .tabs { display: flex; background: #0b141a; border-radius: 10px; padding: 4px; margin: 16px 0; }
    .tab-btn { flex: 1; padding: 9px; border: none; background: transparent; color: #8696a0; font-weight: 600; border-radius: 8px; }
    .tab-btn.active { background: #2a3942; color: #fff; }
    .inp-grp { margin-bottom: 12px; }
    .inp-grp label { display: block; font-size: 12px; color: #8696a0; margin-bottom: 4px; }
    .inp-grp input, .inp-grp textarea {
      width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #2a3942;
      background: #0b141a; color: #fff; font-size: 14px; outline: none;
    }
    .btn-main {
      width: 100%; padding: 12px; border: none; border-radius: 10px; background: #2563eb;
      color: #fff; font-weight: 600; font-size: 15px; margin-top: 6px; cursor: pointer;
    }

    /* APP SCREEN */
    #app-screen { display: none; flex-direction: column; height: 100dvh; background: #0b141a; }
    header {
      height: 56px; background: #1f2c34; padding: 0 16px; display: flex;
      align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34;
    }
    .page { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .page.active { display: flex; }
    .pad { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #182229; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222d34; }
    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 14px; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 3px; }
    .msg.other { align-self: flex-start; background: #202c33; color: #e9edef; border-bottom-left-radius: 3px; }
    .msg-name { font-size: 11px; color: #60a5fa; font-weight: 600; margin-bottom: 2px; }
    .msg-time { font-size: 10px; opacity: 0.65; text-align: right; margin-top: 3px; }
    .bar { padding: 10px; background: #1f2c34; display: flex; gap: 8px; border-top: 1px solid #222d34; }
    .bar input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: #2a3942; color: #fff; outline: none; }
    .bar button { background: #2563eb; color: #fff; border: none; padding: 0 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    nav { height: 58px; background: #1f2c34; display: flex; border-top: 1px solid #222d34; }
    .nav-btn { flex: 1; background: transparent; border: none; color: #8696a0; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
    .nav-btn.active { color: #3b82f6; font-weight: 700; }
  </style>
</head>
<body>

  <div id="toast"></div>

  <!-- 1. 3D ROTATING GLOBE INTRO -->
  <div id="splash-screen">
    <canvas id="globeCanvas" width="240" height="240"></canvas>
    <div class="splash-title">ONE WORLD</div>
    <div class="splash-sub">CONNECTING HUMANITY</div>
    <button class="btn-enter" onclick="enterApp()">Enter App →</button>
  </div>

  <!-- 2. LOGIN / SIGNUP -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2 style="text-align:center;">🌍 ONE WORLD</h2>
      <div class="tabs">
        <button class="tab-btn active" id="t-login" onclick="setMode('login')">Login</button>
        <button class="tab-btn" id="t-signup" onclick="setMode('signup')">Sign Up</button>
      </div>
      <div class="inp-grp" id="u-grp" style="display:none;">
        <label>Username</label>
        <input type="text" id="a-user" placeholder="Apna naam likhein" />
      </div>
      <div class="inp-grp">
        <label>Email</label>
        <input type="email" id="a-email" placeholder="email@example.com" />
      </div>
      <div class="inp-grp">
        <label>Password</label>
        <input type="password" id="a-pass" placeholder="Min 6 characters" />
      </div>
      <button class="btn-main" id="a-btn" onclick="doAuth()">Login</button>
    </div>
  </div>

  <!-- 3. MAIN APP -->
  <div id="app-screen">
    <header>
      <strong>🌍 ONE WORLD</strong>
      <button onclick="doLogout()" style="background:#334155; color:#fff; border:none; padding:5px 10px; border-radius:8px; font-size:11px;">Logout</button>
    </header>

    <div id="p-home" class="page active">
      <div class="pad">
        <div style="background:linear-gradient(135deg,#1e3a8a,#172554); padding:16px; border-radius:14px;">
          <h3 id="welcome-txt">Welcome!</h3>
          <p style="font-size:12px; color:#bfdbfe; margin-top:4px;">Kisi bhi member par "Chat" dabakar Private DM karein.</p>
        </div>
        <div style="font-size:12px; color:#8696a0; font-weight:700;">MEMBERS</div>
        <div id="home-users">Loading...</div>
      </div>
    </div>

    <div id="p-chat" class="page">
      <div class="chat-box" id="g-box"></div>
      <div class="bar">
        <input type="text" id="g-inp" placeholder="Global message..." onkeypress="if(event.key==='Enter') sendGlobal()" />
        <button onclick="sendGlobal()">Send</button>
      </div>
    </div>

    <div id="p-inbox" class="page">
      <div id="dm-list" class="pad">
        <div style="font-size:12px; color:#8696a0; font-weight:700;">PRIVATE MESSAGES (DM)</div>
        <div id="inbox-users"></div>
      </div>
      <div id="dm-view" style="display:none; flex-direction:column; flex:1; height:100%;">
        <div style="background:#131c22; padding:10px 14px; display:flex; align-items:center; gap:10px;">
          <button onclick="closeDM()" style="background:#2a3942; color:#fff; border:none; padding:5px 10px; border-radius:6px;">← Back</button>
          <strong id="dm-name">User</strong>
        </div>
        <div class="chat-box" id="dm-box"></div>
        <div class="bar">
          <input type="text" id="dm-inp" placeholder="Private message..." onkeypress="if(event.key==='Enter') sendDM()" />
          <button onclick="sendDM()">Send</button>
        </div>
      </div>
    </div>

    <div id="p-profile" class="page">
      <div class="pad">
        <div class="inp-grp"><label>Username</label><input type="text" id="pr-user" /></div>
        <div class="inp-grp"><label>Country</label><input type="text" id="pr-country" placeholder="India" /></div>
        <div class="inp-grp"><label>Bio</label><textarea id="pr-bio" rows="3"></textarea></div>
        <button class="btn-main" onclick="saveProfile()">Save Profile</button>
        <button class="btn-main" style="background:#dc2626;" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" onclick="goPage('home', this)"><span>🏠</span>Home</button>
      <button class="nav-btn" onclick="goPage('chat', this)"><span>🌍</span>Chat</button>
      <button class="nav-btn" onclick="goPage('inbox', this)"><span>💬</span>Inbox</button>
      <button class="nav-btn" onclick="goPage('profile', this)"><span>👤</span>Profile</button>
    </nav>
  </div>

  <script>
    // 3D Rotating Globe
    const c = document.getElementById('globeCanvas');
    const ctx = c.getContext('2d');
    let rot = 0;
    const dots = [];
    for (let lat = -80; lat <= 80; lat += 14) {
      const rLat = lat * Math.PI / 180;
      const step = Math.max(14, Math.round(14 / Math.cos(rLat)));
      for (let lon = 0; lon < 360; lon += step) dots.push({ lat: rLat, lon: lon * Math.PI / 180 });
    }
    function drawGlobe() {
      if (document.getElementById('splash-screen').style.display === 'none') return;
      ctx.clearRect(0, 0, 240, 240);
      const cx = 120, cy = 120, R = 95;
      const grad = ctx.createRadialGradient(cx - 25, cy - 25, 10, cx, cy, R);
      grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(1, '#09111e');
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
      ctx.strokeStyle = 'rgba(59,130,246,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
      dots.forEach(d => {
        const lon = d.lon + rot;
        const x = R * Math.cos(d.lat) * Math.sin(lon);
        const y = R * Math.sin(d.lat);
        const z = R * Math.cos(d.lat) * Math.cos(lon);
        if (z > -10) {
          const alpha = (z + R) / (2 * R);
          ctx.beginPath(); ctx.arc(cx + x, cy - y, z > 0 ? 2.2 : 1.2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`; ctx.fill();
        }
      });
      rot += 0.025;
      requestAnimationFrame(drawGlobe);
    }
    drawGlobe();

    function enterApp() {
      document.getElementById('splash-screen').style.display = 'none';
      checkUser();
    }
    setTimeout(enterApp, 2800);

    const sb = window.supabase.createClient("https://hqxzfccywgdiimjvgrmt.supabase.co", "sb_publishable_4tGIrCOEl8v2FXm3GCjGeQ_m1MQn1r4");
    let me = null, myProf = null, mode = 'login', dmUser = null;
    const shownIds = new Set();

    function toast(msg, ok = false) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.style.background = ok ? '#10b981' : '#ef4444';
      t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 4500);
    }

    function setMode(m) {
      mode = m;
      document.getElementById('t-login').classList.toggle('active', m === 'login');
      document.getElementById('t-signup').classList.toggle('active', m === 'signup');
      document.getElementById('u-grp').style.display = m === 'signup' ? 'block' : 'none';
      document.getElementById('a-btn').textContent = m === 'login' ? 'Login' : 'Create Account';
    }

    async function doAuth() {
      const email = document.getElementById('a-email').value.trim();
      const password = document.getElementById('a-pass').value.trim();
      const username = document.getElementById('a-user').value.trim();
      if (!email || !password) return toast("Email aur Password bharein");

      const btn = document.getElementById('a-btn');
      btn.textContent = "Wait...";
      if (mode === 'signup') {
        if (!username) { btn.textContent = "Create Account"; return toast("Username likhein"); }
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) { btn.textContent = "Create Account"; return toast(error.message); }
        if (data.user) {
          await sb.from('profiles').upsert({ id: data.user.id, username });
          toast("Account ban gaya!", true);
          checkUser();
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { btn.textContent = "Login"; return toast(error.message); }
        checkUser();
      }
      btn.textContent = mode === 'login' ? 'Login' : 'Create Account';
    }

    async function checkUser() {
      const { data: { user }, error } = await sb.auth.getUser();
      if (user && !error) {
        me = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'flex';
        await loadProfile();
        loadUsers();
        loadGlobal();
        listenLive();
      } else {
        await sb.auth.signOut();
        me = null;
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
      }
    }

    async function loadProfile() {
      let { data } = await sb.from('profiles').select('*').eq('id', me.id).single();
      if (!data) {
        const res = await sb.from('profiles').upsert({ id: me.id, username: me.email.split('@')[0] }).select().single();
        data = res.data;
      }
      myProf = data || { username: me.email.split('@')[0] };
      document.getElementById('welcome-txt').textContent = "Welcome, " + myProf.username;
      document.getElementById('pr-user').value = myProf.username || '';
      document.getElementById('pr-country').value = myProf.country || '';
      document.getElementById('pr-bio').value = myProf.bio || '';
    }

    async function saveProfile() {
      const username = document.getElementById('pr-user').value.trim();
      const country = document.getElementById('pr-country').value.trim();
      const bio = document.getElementById('pr-bio').value.trim();
      const { error } = await sb.from('profiles').upsert({ id: me.id, username, country, bio });
      if (error) return toast(error.message);
      toast("Profile Saved!", true);
      loadProfile(); loadUsers();
    }

    async function loadUsers() {
      const { data } = await sb.from('profiles').select('*');
      if (!data) return;
      const list = data.filter(u => u.id !== me.id).map(u => `
        <div class="card" style="margin-bottom:8px;">
          <div><strong>${u.username}</strong> <span style="font-size:11px;color:#60a5fa;">(${u.country || 'Global'})</span><div style="font-size:12px;color:#8696a0;">${u.bio || ''}</div></div>
          <button onclick="openDM('${u.id}','${u.username}')" style="background:#2563eb;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;">Chat</button>
        </div>
      `).join('') || '<p style="font-size:13px;color:#8696a0;">Abhi koi aur member nahi hai. Incognito tab mein doosra account banayein!</p>';
      document.getElementById('home-users').innerHTML = list;
      document.getElementById('inbox-users').innerHTML = list;
    }

    async function loadGlobal() {
      const { data, error } = await sb.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
      if (error) return toast(error.message);
      const box = document.getElementById('g-box');
      box.innerHTML = '';
      shownIds.clear();
      if (data) data.forEach(addGlobalUI);
    }

    function addGlobalUI(m) {
      if (m.id && shownIds.has(m.id)) return;
      if (m.id) shownIds.add(m.id);
      const box = document.getElementById('g-box');
      const isMe = m.user_id === me.id;
      const d = document.createElement('div');
      d.className = 'msg ' + (isMe ? 'me' : 'other');
      d.innerHTML = `${!isMe ? `<div class="msg-name">${m.username || 'User'}</div>` : ''}${m.content}<div class="msg-time">${new Date(m.created_at || Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    async function sendGlobal() {
      const inp = document.getElementById('g-inp');
      const content = inp.value.trim();
      if (!content) return;
      inp.value = '';
      const { data, error } = await sb.from('messages').insert({
        user_id: me.id,
        username: myProf?.username || 'User',
        content
      }).select().single();
      if (error) return toast("Error: " + error.message);
      if (data) addGlobalUI(data);
    }

    function openDM(id, name) {
      dmUser = { id, name };
      goPage('inbox', document.querySelectorAll('.nav-btn')[2]);
      document.getElementById('dm-list').style.display = 'none';
      document.getElementById('dm-view').style.display = 'flex';
      document.getElementById('dm-name').textContent = name;
      loadDM();
    }

    function closeDM() {
      dmUser = null;
      document.getElementById('dm-view').style.display = 'none';
      document.getElementById('dm-list').style.display = 'flex';
    }

    async function loadDM() {
      const { data, error } = await sb.from('private_messages').select('*')
        .or(`and(sender_id.eq.${me.id},receiver_id.eq.${dmUser.id}),and(sender_id.eq.${dmUser.id},receiver_id.eq.${me.id})`)
        .order('created_at', { ascending: true });
      if (error) return toast(error.message);
      const box = document.getElementById('dm-box');
      box.innerHTML = '';
      if (data) data.forEach(addDMUI);
    }

    function addDMUI(m) {
      if (!dmUser) return;
      if (m.id && shownIds.has('dm_' + m.id)) return;
      if (m.id) shownIds.add('dm_' + m.id);
      if (!((m.sender_id === me.id && m.receiver_id === dmUser.id) || (m.sender_id === dmUser.id && m.receiver_id === me.id))) return;
      const box = document.getElementById('dm-box');
      const d = document.createElement('div');
      d.className = 'msg ' + (m.sender_id === me.id ? 'me' : 'other');
      d.innerHTML = `${m.content}<div class="msg-time">${new Date(m.created_at || Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    async function sendDM() {
      const inp = document.getElementById('dm-inp');
      const content = inp.value.trim();
      if (!content) return;
      inp.value = '';
      const { data, error } = await sb.from('private_messages').insert({
        sender_id: me.id,
        receiver_id: dmUser.id,
        content
      }).select().single();
      if (error) return toast("DM Error: " + error.message);
      if (data) addDMUI(data);
    }

    function listenLive() {
      sb.channel('live')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => addGlobalUI(p.new))
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages' }, p => addDMUI(p.new))
        .subscribe();
    }

    function goPage(p, btn) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.getElementById('p-' + p).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    async function doLogout() {
      await sb.auth.signOut();
      me = null;
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
      toast("Logged out!", true);
    }
        </script>
