<style>
:root{--bg:#060d1f;--s1:#0e1a36;--s2:#16264d;--ln:#223461;--bl:#2f7bff;--cy:#5ad1ff;--tx:#e8eefc;--mu:#8a99bd}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.mu{color:var(--mu)}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--ln)}
header img{width:28px;height:28px;border-radius:8px}
header b{font-size:18px;letter-spacing:.18em}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.col{flex:1;min-height:0;display:flex;flex-direction:column}
.list{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex}.row.mine{justify-content:flex-end}
.bubble{max-width:82%;background:var(--s2);padding:8px 12px;border-radius:16px 16px 16px 4px;word-break:break-word;white-space:pre-wrap}
.mine .bubble{background:var(--bl);border-radius:16px 16px 4px 16px}
.who{font-size:12px;color:var(--cy);margin-bottom:2px}.who[data-uid]{cursor:pointer;text-decoration:underline;font-weight:600}
.t{font-size:11px;color:#ffffff88;margin-top:2px;text-align:right}
.send{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--ln)}
input,textarea{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.btn{background:var(--bl);border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;color:#fff}
.btn.alt{background:var(--s2)}
nav{display:flex;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:14px 0;color:var(--mu);font-size:14px}
nav button.on{color:var(--cy);font-weight:600}
nav button.dot::after{content:" \25CF";color:#ff5a7a;font-size:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;text-align:left;width:100%;cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:var(--s2);object-fit:cover;display:grid;place-items:center;font-weight:700;flex:none}
.card .m{flex:1;min-width:0}
.card small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.note{padding:10px 16px;background:var(--s1);color:var(--cy);font-size:14px;border-bottom:1px solid var(--ln)}.sec{font-size:12px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin:6px 2px 0}
.dmh{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--ln)}
#dmHead{display:flex;align-items:center;gap:10px}
#pav .av{width:96px;height:96px;font-size:36px}
#auth{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;max-width:420px;margin:auto;width:100%;text-align:center}
#auth h1{font-size:28px;letter-spacing:.22em}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;border:1px solid var(--ln);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:9}
</style>
</head>
<body>

<div id="auth">
  <canvas id="globe" width="240" height="240" style="width:130px;height:130px;margin:0 auto" aria-hidden="true"></canvas>
  <h1>ONE WORLD</h1>
  <p class="mu">One community. Every country.</p>
  <input id="un" placeholder="Username (for new accounts)" autocomplete="username">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" id="bin">Log in</button>
  <button class="btn alt" id="bup">Create account</button>

  <main>
    <section class="view" id="v-chat">

        <div class="dmh"><button class="btn alt" id="back" aria-label="Back">&#8249;</button><div id="dmHead"></div></div>

        <div class="send hide" id="dmActs"><button class="btn" id="acc">Accept</button><button class="btn alt" id="dec">Decline</button></div>

      </div>
    </section>

    <section class="view" id="v-explore">
      <div class="pad"><input id="q" placeholder="Search by name or country"><div class="stack" id="members"></div></div>

    <section class="view" id="v-me">
      <div class="pad">
        <div id="pav"></div>
        <label class="btn alt" style="align-self:flex-start">Change photo<input id="file" type="file" accept="image/*" hidden></label>

        <input id="pc" placeholder="Country" maxlength="40">
        <textarea id="pb" rows="3" maxlength="200" placeholder="Short bio"></textarea>

</div>
<div id="toast" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://hqxzfccywgdiimjvgrmt.supabase.co";
const SUPABASE_KEY="sb_publishable_4tGIrCOEl8v2FXm3GCjGeQ_m1MQn1r4";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const tm=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const nm=p=>(p&&p.username)||'Member';
const av=p=>p&&p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" alt="">`:`<div class="av">${esc(nm(p)[0].toUpperCase())}</div>`;
let me,prof={},peer=null,ch,newAv=null,mem=[],seenC=new Set(),seenD=new Set(),pc={};

function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3500)}

/* ---------- auth ---------- */
async function auth(kind){
  const email=$('em').value.trim(),password=$('pw').value,u=$('un').value.trim();
  if(!email||!password)return toast('Enter your email and password');
  if(kind==='up'&&!u)return toast('Choose a username first');
  const r=kind==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return toast(r.error.message);
  if(!r.data.session)return toast('Check your email to confirm, then log in');
  if(kind==='up'){const e=(await sb.from('profiles').upsert({id:r.data.user.id,username:u})).error;if(e)toast(e.message)}
  boot(r.data.session.user);
}
async function boot(u){
  me=u;
  let {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
  if(!data){data={id:me.id,username:(me.email||'member').split('@')[0]};await sb.from('profiles').upsert(data)}
  prof=data;pc[me.id]=prof;
  $('auth').classList.add('hide');$('app').classList.remove('hide');
  if(!prof.username){prof.username=(me.email||'member').split('@')[0];sb.from('profiles').upsert({id:me.id,username:prof.username})}
  fillMe();await loadChat();await loadInbox();subscribe();tab('chat');
  if(!window.pt)window.pt=setInterval(poll,2000);
}

/* ---------- realtime ---------- */
function subscribe(){
  if(ch)sb.removeChannel(ch);
  ch=sb.channel('ow')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>addChat(p.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'private_messages'},p=>onDM(p.new))
    .on('postgres_changes',{event:'*',schema:'public',table:'dm_requests'},p=>onReq(p.new))
    .subscribe();
}

/* ---------- global chat ---------- */
function bub(m,mine,uid){return `<div class="row${mine?' mine':''}"><div class="bubble">${m.sender_name&&!mine?`<div class="who"${uid?` data-uid="${uid}"`:''}>${esc(m.sender_name)}</div>`:''}${esc(m.content)}<div class="t">${tm(m.created_at)}</div></div></div>`}
function put(id,html){const l=$(id),near=l.scrollHeight-l.scrollTop-l.clientHeight<140;l.insertAdjacentHTML('beforeend',html);if(near)l.scrollTop=l.scrollHeight}
function later(a,b){return !b||new Date(a)>new Date(b)}
let lastC=null,lastD=null;const seenN=new Set();
function addChat(m){if(seenC.has(m.id))return;seenC.add(m.id);if(later(m.created_at,lastC))lastC=m.created_at;put('chatList',bub(m,m.user_id===me.id,m.user_id))}
$('chatList').onclick=e=>{const w=e.target.closest('.who[data-uid]');if(w&&w.dataset.uid!==me.id)openDM(w.dataset.uid)};
async function loadChat(){
  const {data,error}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(100);
  if(error)return toast(error.message);
  $('chatList').innerHTML='';seenC=new Set();(data||[]).reverse().forEach(addChat);$('chatList').scrollTop=1e9;
}
$('chatForm').onsubmit=async e=>{
  e.preventDefault();const t=$('chatIn').value.trim();if(!t)return;$('chatIn').value='';
  const {data,error}=await sb.from('messages').insert({content:t,user_id:me.id,sender_name:nm(prof)}).select().single();
  if(error){$('chatIn').value=t;return toast(error.message)}
  addChat(data);
};

/* ---------- private messages (with message requests) ---------- */
let reqs=new Map(),tmps=[],pn=0;
async function profs(ids){
  const need=ids.filter(i=>!pc[i]);
  if(need.length){const {data}=await sb.from('profiles').select('*').in('id',need);(data||[]).forEach(p=>pc[p.id]=p)}
}
async function loadReqs(){
  const {data,error}=await sb.from('dm_requests').select('*').or(`from_id.eq.${me.id},to_id.eq.${me.id}`);
  if(error){if(!loadReqs.w){loadReqs.w=1;toast('Run the new SQL step first: '+error.message)}return}
  reqs=new Map((data||[]).map(r=>[r.from_id===me.id?r.to_id:r.from_id,r]));
}
function state(o){
  const r=reqs.get(o);if(!r)return 'none';
  if(r.status==='accepted')return 'ok';
  if(r.status==='declined')return r.from_id===me.id?'blocked':'declined';
  return r.from_id===me.id?'sent':'incoming';
}
async function loadInbox(){
  await loadReqs();
  const {data,error}=await sb.from('private_messages').select('*').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(300);
  if(error)return toast(error.message);
  if(data&&data[0]&&later(data[0].created_at,lastD))lastD=data[0].created_at;
  const th=new Map();(data||[]).forEach(m=>{const o=m.sender_id===me.id?m.receiver_id:m.sender_id;if(!th.has(o))th.set(o,m)});
  await profs([...th.keys()]);
  const row=([o,m])=>`<button class="card" data-id="${o}">${av(pc[o])}<div class="m"><b>${esc(nm(pc[o]))}</b><small>${state(o)==='sent'?'Request sent - ':''}${m.sender_id===me.id?'You: ':''}${esc(m.content)}</small></div></button>`;
  const all=[...th],inc=all.filter(([o])=>state(o)==='incoming'),rest=all.filter(([o])=>!['incoming','declined'].includes(state(o)));
  let h='';
  if(inc.length)h+=`<h3 class="sec">Message requests (${inc.length})</h3>`+inc.map(row).join('');
  if(rest.length)h+=(inc.length?'<h3 class="sec">Chats</h3>':'')+rest.map(row).join('');
  $('threads').innerHTML=h||'<p class="mu">No chats yet. Tap a name in Chat or open Explore to say hello.</p>';
  if(inc.length&&!$('v-inbox').classList.contains('on'))$('tInbox').classList.add('dot');
}
$('threads').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openDM(b.dataset.id)};
function addDM(m){
  if(seenD.has(m.id))return;
  const mine=m.sender_id===me.id;
  if(mine){const i=tmps.findIndex(x=>x.c===m.content);if(i>=0){tmps.splice(i,1);seenD.add(m.id);return}}
  seenD.add(m.id);m.sender_name=mine?'':nm(pc[m.sender_id]);put('dmList',bub(m,mine));
}
function optimistic(t){
  const l=$('dmList');l.insertAdjacentHTML('beforeend',bub({content:t,created_at:new Date().toISOString()},true));
  l.scrollTop=l.scrollHeight;const x={el:l.lastElementChild,c:t};tmps.push(x);return x;
}
function dmState(){
  if(!peer)return;
  const s=state(peer),n=nm(pc[peer]),sentAlready=$('dmList').querySelectorAll('.row.mine').length>0;
  let note='',send=true,acts=false;
  if(s==='incoming'){note=`${n} wants to message you. Accept to start chatting.`;send=false;acts=true}
  else if(s==='sent'){if(sentAlready){note=`Request sent. You can chat as soon as ${n} accepts.`;send=false}else note='Your first message goes as a request.'}
  else if(s==='none')note='Your first message goes as a request.';
  else if(s==='blocked'){note=`${n} declined your request.`;send=false}
  else if(s==='declined'){note=`You declined ${n}.`;send=false;acts=true}
  $('dmNote').textContent=note;$('dmNote').classList.toggle('hide',!note);
  $('dmActs').classList.toggle('hide',!acts);$('dec').classList.toggle('hide',s==='declined');
  $('dmForm').classList.toggle('hide',!send);
}
async function openDM(id){
  tab('inbox');peer=id;seenD=new Set();tmps=[];
  await profs([id]);await loadReqs();
  $('dmHead').innerHTML=av(pc[id])+`<b>${esc(nm(pc[id]))}</b>`;
  $('inboxPane').classList.add('hide');$('dmPane').classList.remove('hide');
  const {data,error}=await sb.from('private_messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${me.id})`).order('created_at',{ascending:true}).limit(200);
  if(error)return toast(error.message);
  $('dmList').innerHTML='';(data||[]).forEach(addDM);$('dmList').scrollTop=1e9;
  dmState();
}
function onDM(m){
  if(m.sender_id!==me.id&&m.receiver_id!==me.id)return;
  if(later(m.created_at,lastD))lastD=m.created_at;
  const here=peer&&(m.sender_id===peer||m.receiver_id===peer);
  if(here){addDM(m);if(state(peer)!=='ok')loadReqs().then(dmState)}
  if(!seenN.has(m.id)){seenN.add(m.id);
    const viewing=$('v-inbox').classList.contains('on')&&(peer?here:true);
    if(m.receiver_id===me.id&&m.sender_id!==me.id&&!viewing)$('tInbox').classList.add('dot');
    profs([m.sender_id]).then(loadInbox);}
}
function onReq(r){
  if(!r||(r.from_id!==me.id&&r.to_id!==me.id))return;
  loadInbox().then(()=>dmState());
}
$('dmForm').onsubmit=async e=>{
  e.preventDefault();const t=$('dmIn').value.trim();if(!t||!peer)return;$('dmIn').value='';
  const to=peer,x=optimistic(t),fail=msg=>{x.el.remove();tmps=tmps.filter(y=>y!==x);$('dmIn').value=t;toast(msg)};
  if(state(to)==='none'){
    const {error}=await sb.from('dm_requests').insert({from_id:me.id,to_id:to});
    if(error&&!/duplicate/i.test(error.message))return fail(error.message);
    reqs.set(to,{from_id:me.id,to_id:to,status:'pending'});
  }
  const {data,error}=await sb.from('private_messages').insert({sender_id:me.id,receiver_id:to,content:t}).select().single();
  if(error)return fail(error.message);
  addDM(data);dmState();loadInbox();
};
async function answer(status){
  const {error}=await sb.from('dm_requests').update({status}).eq('from_id',peer).eq('to_id',me.id);
  if(error)return toast(error.message);
  const r=reqs.get(peer);if(r)r.status=status;
  dmState();loadInbox();toast(status==='accepted'?'Accepted - you can chat now':'Declined');
}
$('acc').onclick=()=>answer('accepted');
$('dec').onclick=()=>answer('declined');
$('back').onclick=()=>{peer=null;$('dmPane').classList.add('hide');$('inboxPane').classList.remove('hide');loadInbox()};

/* ---------- explore ---------- */
async function loadMembers(){
  const {data,error}=await sb.from('profiles').select('*').neq('id',me.id).order('username').limit(300);
  if(error)return toast(error.message);
  mem=data||[];mem.forEach(p=>pc[p.id]=p);showMembers();
}
function showMembers(){
  const q=$('q').value.toLowerCase();
  const r=mem.filter(p=>(nm(p)+' '+(p.country||'')).toLowerCase().includes(q));
  $('members').innerHTML=r.length?r.map(p=>`<button class="card" data-id="${p.id}">${av(p)}<div class="m"><b>${esc(nm(p))}</b><small>${esc([p.country,p.bio].filter(Boolean).join(' - '))}</small></div><span class="btn">Message</span></button>`).join(''):'<p class="mu">No members found.</p>';
}
$('q').oninput=showMembers;
$('members').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openDM(b.dataset.id)};

/* ---------- profile ---------- */
function fillMe(){$('pu').value=prof.username||'';$('pc').value=prof.country||'';$('pb').value=prof.bio||'';$('pav').innerHTML=av(prof);newAv=null}
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
    newAv=c.toDataURL('image/jpeg',.8);$('pav').innerHTML=av({username:nm(prof),avatar_url:newAv})};
  img.src=URL.createObjectURL(f);
};
$('save').onclick=async()=>{
  const u={id:me.id,username:$('pu').value.trim()||nm(prof),country:$('pc').value.trim(),bio:$('pb').value.trim()};
  if(newAv)u.avatar_url=newAv;
  const {error}=await sb.from('profiles').upsert(u);
  if(error)return toast(error.message);
  prof={...prof,...u};pc[me.id]=prof;fillMe();toast('Profile saved');
};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};

/* ---------- navigation + start ---------- */
function tab(n){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+n));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
  if(n==='inbox'){$('tInbox').classList.remove('dot');loadInbox()}
  if(n==='explore')loadMembers();
  if(n==='chat')setTimeout(()=>{$('chatList').scrollTop=1e9},0);
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.t)};
$('bin').onclick=()=>auth('in');
$('bup').onclick=()=>auth('up');
sb.auth.getSession().then(({data})=>{if(data.session)boot(data.session.user)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');

/* ---------- auto refresh (works even if realtime is off) ---------- */
async function poll(){
  if(!me||document.hidden)return;
  let q=sb.from('messages').select('*').order('created_at',{ascending:true}).limit(50);
  if(lastC)q=q.gt('created_at',lastC);
  const a=await q;(a.data||[]).forEach(addChat);
  let d=sb.from('private_messages').select('*').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order('created_at',{ascending:true}).limit(50);
  if(lastD)d=d.gt('created_at',lastD);
  const b=await d;(b.data||[]).forEach(onDM);
  if(++pn%3===0){await loadInbox();dmState()}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

/* ---------- 3D rotating globe ---------- */
(function(){
  const c=$('globe'),x=c.getContext('2d'),R=100,T=.4;let a=0;
  const P=(f,l)=>{const X=Math.cos(f)*Math.sin(l+a),Y=Math.sin(f),Z=Math.cos(f)*Math.cos(l+a);return[120+R*X,120-R*(Y*Math.cos(T)-Z*Math.sin(T)),Y*Math.sin(T)+Z*Math.cos(T)]};
  const line=(fn,n)=>{x.beginPath();let on=false;for(let i=0;i<=n;i++){const p=fn(i/n);if(p[2]>0){on?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);on=true}else on=false}x.stroke()};
  function draw(){
    if($('auth').classList.contains('hide'))return;
    x.clearRect(0,0,240,240);
    const g=x.createRadialGradient(90,80,10,120,120,R);g.addColorStop(0,'#7fd0ff');g.addColorStop(1,'#1456d6');
    x.fillStyle=g;x.beginPath();x.arc(120,120,R,0,7);x.fill();
    x.lineWidth=1.6;x.strokeStyle='rgba(255,255,255,.5)';
    for(let k=0;k<12;k++){const l=k*Math.PI/6;line(u=>P((u-.5)*Math.PI,l),40)}
    for(const d of [-60,-30,0,30,60]){const f=d*Math.PI/180;line(u=>P(f,u*2*Math.PI),60)}
    x.strokeStyle='rgba(180,225,255,.9)';x.lineWidth=2.5;x.beginPath();x.arc(120,120,R,0,7);x.stroke();
    a+=.012;requestAnimationFrame(draw);
  }
  draw();
})();
</script>
