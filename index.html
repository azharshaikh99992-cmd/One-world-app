<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ONE WORLD</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-main: #0b141a;
      --bg-header: #1f2c34;
      --bg-card: #182229;
      --bg-input: #2a3942;
      --msg-me: #1d4ed8;
      --msg-other: #202c33;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --border: #222d34;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #050b14; color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Hide Netlify Badge */
    a[href*="netlify.com"], div[class*="netlify"], iframe[src*="netlify"] {
      display: none !important; opacity: 0 !important; pointer-events: none !important;
    }

    /* Toast Notification */
    #toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #ef4444; color: white; padding: 11px 20px; border-radius: 22px;
      font-size: 13px; font-weight: 500; z-index: 99999; display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6); max-width: 90%; text-align: center;
    }

    /* 3D GLOBE INTRO SPLASH SCREEN */
    #splash-screen {
      position: fixed; inset: 0; background: radial-gradient(circle at center, #0d1f3c 0%, #030712 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 5000; transition: opacity 0.6s ease;
    }
    #globe-container { width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
    .splash-title {
      font-size: 28px; font-weight: 800; letter-spacing: 4px; margin-top: 10px;
      background: linear-gradient(90deg, #60a5fa, #38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .splash-sub { color: #94a3b8; font-size: 13px; margin-top: 6px; letter-spacing: 1px; }
    .btn-enter {
      margin-top: 26px; padding: 12px 28px; border-radius: 25px; border: 1px solid #3b82f6;
      background: rgba(37, 99, 235, 0.25); color: #fff; font-weight: 600; font-size: 14px;
      cursor: pointer; backdrop-filter: blur(6px);
    }

    /* Auth Screen */
    #auth-screen {
      display: none; flex-direction: column; justify-content: center; align-items: center;
      height: 100dvh; padding: 24px; background: radial-gradient(circle at top, #162836, #0b141a);
    }
    .auth-box {
      width: 100%; max-width: 380px; background: var(--bg-header); padding: 28px 22px;
      border-radius: 18px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .auth-sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .tabs { display: flex; background: var(--bg-main); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
    .tab-btn {
      flex: 1; padding: 9px; border: none; background: transparent; color: var(--text-muted);
      font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    .tab-btn.active { background: var(--bg-input); color: var(--text-main); }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input, .input-group textarea {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none;
    }
    .input-group input:focus { border-color: #3b82f6; }
    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 10px; background: #2563eb;
      color: white; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Main App Layout */
    #app-screen { display: none; flex-direction: column; height: 100dvh; background: var(--bg-main); }
    header {
      height: 58px; background: var(--bg-header); padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    .badge-online { font-size: 11px; background: rgba(0, 168, 132, 0.15); color: #00a884; padding: 3px 8px; border-radius: 12px; }

    /* Pages */
    .page { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .page.active { display: flex; }

    /* Home Page */
    .home-pad { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .welcome-card {
      background: linear-gradient(135deg, #1e3a8a, #172554); padding: 18px; border-radius: 16px;
    }
    .welcome-card h2 { font-size: 18px; margin-bottom: 4px; }
    .welcome-card p { font-size: 13px; color: #bfdbfe; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .user-card {
      background: var(--bg-card); padding: 12px 14px; border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border);
    }
    .user-info h4 { font-size: 15px; margin-bottom: 2px; }
    .user-info p { font-size: 12px; color: var(--text-muted); }
    .btn-dm {
      background: #2563eb; color: white; border: none; padding: 7px 14px;
      border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }

    /* Chat Area */
    .chat-messages {
      flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
      background-size: 20px 20px;
    }
    .msg-row { display: flex; flex-direction: column; max-width: 78%; }
    .msg-row.me { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }
    .msg-sender { font-size: 11px; color: #60a5fa; margin-bottom: 3px; padding: 0 4px; font-weight: 600; }
    .msg-bubble {
      padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.4;
      word-wrap: break-word; position: relative;
    }
    .msg-row.me .msg-bubble { background: var(--msg-me); color: #fff; border-bottom-right-radius: 3px; }
    .msg-row.other .msg-bubble { background: var(--msg-other); color: var(--text-main); border-bottom-left-radius: 3px; }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 4px; text-align: right; }

    .chat-input-bar {
      padding: 10px 12px; background: var(--bg-header); display: flex; gap: 8px;
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-input-bar input {
      flex: 1; padding: 11px 15px; border-radius: 22px; border: none;
      background: var(--bg-input); color: var(--text-main); font-size: 14px; outline: none;
    }
    .btn-send {
      background: #2563eb; color: white; border: none; padding: 0 18px;
      border-radius: 22px; font-weight: 600; font-size: 14px; cursor: pointer;
    }

    .dm-subbar {
      background: #131c22; padding: 10px 14px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .btn-back { background: var(--bg-input); color: white; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; }

    /* Bottom Navigation */
    nav {
      height: 60px; background: var(--bg-header); display: flex;
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 11px; gap: 4px; cursor: pointer; border: none; background: transparent;
    }
    .nav-item.active { color: #3b82f6; font-weight: 600; }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>

  <div id="toast"></div>

  <!-- 1. 3D ROTATING GLOBE INTRO SCREEN -->
  <div id="splash-screen">
    <div id="globe-container"></div>
    <div class="splash-title">ONE WORLD</div>
    <div class="splash-sub">CONNECTING HUMANITY</div>
    <button class="btn-enter" onclick="finishSplash()">Enter App →</button>
  </div>

  <!-- 2. LOGIN / SIGNUP SCREEN -->
  <div id="auth-screen">
    <div class="auth-box">
      <div class="logo-wrap">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <h2>ONE WORLD</h2>
      </div>
      <p class="auth-sub">Login ya naya account banayein</p>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
        <button class="tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <div class="input-group" id="username-group" style="display:none;">
        <label>Username</label>
        <input type="text" id="auth-username" placeholder="Apna naam likhein" />
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="name@example.com" />
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="auth-password" placeholder="Min 6 characters" />
      </div>

      <button class="btn-primary" id="auth-submit-btn" onclick="handleAuth()">Login</button>
    </div>
  </div>

  <!-- 3. MAIN APP SCREEN -->
  <div id="app-screen">
    <header>
      <div class="header-left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span class="header-title">ONE WORLD</span>
      </div>
      <span class="badge-online">● Live</span>
    </header>

    <!-- PAGE 1: HOME -->
    <div id="page-home" class="page active">
      <div class="home-pad">
        <div class="welcome-card">
          <h2 id="welcome-user">Welcome!</h2>
          <p>Duniya bhar ke logon se Global Chat ya Private DM mein baat karein.</p>
        </div>
        <div class="section-title">Community Members</div>
        <div id="users-list">Loading members...</div>
      </div>
    </div>

    <!-- PAGE 2: GLOBAL CHAT -->
    <div id="page-chat" class="page">
      <div class="chat-messages" id="global-chat-box"></div>
      <div class="chat-input-bar">
        <input type="text" id="global-msg-input" placeholder="Global message likhein..." onkeypress="if(event.key==='Enter') sendGlobalMessage()" />
        <button class="btn-send" onclick="sendGlobalMessage()">Send</button>
      </div>
    </div>

    <!-- PAGE 3: PRIVATE INBOX (DM) -->
    <div id="page-inbox" class="page">
      <div id="inbox-list-view" class="home-pad">
        <div class="section-title">Select User for Private Chat</div>
        <div id="inbox-users-list"></div>
      </div>
      <div id="dm-chat-view" style="display:none; flex-direction:column; flex:1; height:100%;">
        <div class="dm-subbar">
          <button class="btn-back" onclick="closeDM()">← Back</button>
          <strong id="dm-partner-name">User</strong>
        </div>
        <div class="chat-messages" id="dm-chat-box"></div>
        <div class="chat-input-bar">
          <input type="text" id="dm-msg-input" placeholder="Private message likhein..." onkeypress="if(event.key==='Enter') sendDM()" />
          <button class="btn-send" onclick="sendDM()">Send</button>
        </div>
      </div>
    </div>

    <!-- PAGE 4: PROFILE -->
    <div id="page-profile" class="page">
      <div class="home-pad">
        <div class="section-title">My Profile Settings</div>
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="prof-username" />
        </div>
        <div class="input-group">
          <label>Country</label>
          <input type="text" id="prof-country" placeholder="e.g. India" />
        </div>
        <div class="input-group">
          <label>Bio</label>
          <textarea id="prof-bio" rows="3" placeholder="Apne baare mein kuch likhein..."></textarea>
        </div>
        <button class="btn-primary" onclick="updateProfile()">Save Profile</button>
        <button class="btn-primary" style="background:#dc2626; margin-top:12px;" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav>
      <button class="nav-item active" onclick="switchPage('home', this)">
        <span class="nav-icon">🏠</span><span>Home</span>
      </button>
      <button class="nav-item" onclick="switchPage('chat', this)">
        <span class="nav-icon">🌍</span><span>Chat</span>
      </button>
      <button class="nav-item" onclick="switchPage('inbox', this)">
        <span class="nav-icon">💬</span><span>Inbox</span>
      </button>
      <button class="nav-item" onclick="switchPage('profile', this)">
        <span class="nav-icon">👤</span><span>Profile</span>
      </button>
    </nav>
  </div>

  <script>
    // 1. 3D Rotating Globe Animation
    function init3DGlobe() {
      try {
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 3.2;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(250, 250);
        container.appendChild(renderer.domElement);

        // Glowing Wireframe + Dotted Sphere
        const geo = new THREE.SphereGeometry(1.15, 28, 28);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true, transparent: true, opacity: 0.45 });
        const globe = new THREE.Mesh(geo, wireMat);
        scene.add(globe);

        const coreGeo = new THREE.SphereGeometry(1.08, 24, 24);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
        scene.add(new THREE.Mesh(coreGeo, coreMat));

        const ptsMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.045 });
        const pts = new THREE.Points(geo, ptsMat);
        scene.add(pts);

        function animate() {
          if (document.getElementById('splash-screen').style.display === 'none') return;
          requestAnimationFrame(animate);
          globe.rotation.y += 0.012;
          globe.rotation.x = 0.25;
          pts.rotation.y += 0.012;
          pts.rotation.x = 0.25;
          renderer.render(scene, camera);
        }
        animate();
      } catch (e) {
        console.log("3D fallback");
      }
    }
    init3DGlobe();

    let splashDone = false;
    function finishSplash() {
      if (splashDone) return;
      splashDone = true;
      const s = document.getElementById('splash-screen');
      s.style.opacity = '0';
      setTimeout(() => {
        s.style.display = 'none';
        checkSession();
      }, 500);
    }
    setTimeout(finishSplash, 2800);

    // 2. Inline PWA Manifest
    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0b141a"/><circle cx="256" cy="256" r="160" fill="none" stroke="#3b82f6" stroke-width="28"/><path d="M96 256h320M256 96a245 245 0 0 1 64 160 245 245 0 0 1-64 160 245 245 0 0 1-64-160 245 245 0 0 1 64-160z" fill="none" stroke="#3b82f6" stroke-width="24"/></svg>`;
    const manifest = {
      name: "ONE WORLD Chat",
      short_name: "ONE WORLD",
      start_url: "/",
      display: "standalone",
      background_color: "#0b141a",
      theme_color: "#0b141a",
      icons: [{ src: "data:image/svg+xml;base64," + btoa(iconSvg), sizes: "512x512", type: "image/svg+xml" }]
    };
    const mLink = document.createElement("link");
    mLink.rel = "manifest";
    mLink.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(mLink);

    // 3. Supabase Client
    const SUPABASE_URL = "https://hqxzfccywgdiimjvgrmt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4tGIrCOEl8v2FXm3GCjGeQ_m1MQn1r4";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentProfile = null;
    let authMode = 'login';
    let activeDMUser = null;

    function showToast(msg, isSuccess = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isSuccess ? '#10b981' : '#ef4444';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('username-group').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Login' : 'Create Account';
    }

    async function handleAuth() {
      const btn = document.getElementById('auth-submit-btn');
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const username = document.getElementById('auth-username').value.trim();

      if (!email || !password) return showToast("Email aur Password dono bharein!");
      if (password.length < 6) return showToast("Password kam se kam 6 characters ka rakhein!");

      btn.disabled = true;
      btn.textContent = "Please wait...";

      try {
        if (authMode === 'signup') {
          if (!username) {
            btn.disabled = false; btn.textContent = "Create Account";
            return showToast("Apna Username likhein!");
          }
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) {
            btn.disabled = false; btn.textContent = "Create Account";
            return showToast(error.message);
          }
          if (data.user) {
            await sb.from('profiles').upsert({ id: data.user.id, username: username });
            if (data.session) {
              showToast("Account ban gaya!", true);
              checkSession();
            } else {
              showToast("Account ban gaya! Agar login na ho toh Supabase mein Confirm Email OFF karein.", true);
              switchAuthTab('login');
            }
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) {
            btn.disabled = false; btn.textContent = "Login";
            return showToast("Login Error: " + error.message);
          }
          checkSession();
        }
      } catch (err) {
        showToast("Network error: " + err.message);
      }
      btn.disabled = false;
      btn.textContent = authMode === 'login' ? 'Login' : 'Create Account';
    }

    async function ch
